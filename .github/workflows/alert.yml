name: SmrodoBot Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: smrodobot-forecast
  cancel-in-progress: false

jobs:
  check-forecast:
    # Keep the bot's real Telegram notifications and state updates on main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout bot code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore persistent alert history
        uses: actions/checkout@v4
        with:
          ref: bot-state
          path: .bot-state
          persist-credentials: true

      - name: Load alert history
        shell: bash
        run: |
          if [ -f .bot-state/alert_state.json ]; then
            cp .bot-state/alert_state.json alert_state.json
          else
            echo '{}' > alert_state.json
          fi

      - name: Run SmrodoBot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alert.py

      - name: Save persistent alert history
        shell: bash
        run: |
          if [ ! -f alert_state.json ]; then
            echo 'No state file produced; nothing to save.'
            exit 0
          fi
          cp alert_state.json .bot-state/alert_state.json
          cd .bot-state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alert_state.json
          if git diff --cached --quiet; then
            echo 'Alert history unchanged.'
            exit 0
          fi
          git commit -m 'Update SmrodoBot alert history'
          git push origin HEAD:bot-state
