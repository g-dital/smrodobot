name: SmrodoBot Tests

on:
  push:
    branches:
      - develop-v05
      - main
    paths:
      - 'alert.py'
      - 'test_alert.py'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'alert.py'
      - 'test_alert.py'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile alert.py test_alert.py

      - name: Run automated tests
        run: python -m unittest -v test_alert.py
